label="Ustawienia">⚙️</button></header><main id="main"></main><nav id="nav"></nav><dialog id="modal"><div id="modalBody"></div></dialog><dialog id="noticeDialog" aria-labelledby="noticeTitle"><h2 id="noticeTitle"></h2><p id="noticeText" class="noticeText"></p><div id="noticeExtra"></div><div id="noticeActions" class="actions"></div></dialog><div id="toast"></div><script>
// Spójne okna aplikacji zamiast natywnych alert/confirm/prompt z adresem file://.
function uiDialog({title='MotoGarage',message='',kind='info',value=''}){
 return new Promise(resolve=>{
  const d=document.getElementById('noticeDialog');
  const titleEl=document.getElementById('noticeTitle'), textEl=document.getElementById('noticeText');
  const extra=document.getElementById('noticeExtra'), actions=document.getElementById('noticeActions');
  titleEl.textContent=title; textEl.textContent=message; extra.replaceChildren(); actions.replaceChildren();
  let finished=false;
  const finish=v=>{if(finished)return;finished=true;d.removeEventListener('cancel',cancel);d.close();resolve(v)};
  const cancel=e=>{e.preventDefault();finish(kind==='prompt'?null:false)};
  d.addEventListener('cancel',cancel);
  let input;
  if(kind==='prompt'){input=document.createElement('textarea');input.value=value;input.setAttribute('aria-label','Treść do skopiowania');extra.append(input)}
  const add=(label,css,onClick)=>{const b=document.createElement('button');b.type='button';b.className=css;b.textContent=label;b.onclick=onClick;actions.append(b)};
  if(kind==='confirm'||kind==='prompt')add('Anuluj','secondary',()=>finish(kind==='prompt'?null:false));
  add(kind==='confirm'?'Usuń / Potwierdź':kind==='prompt'?'Gotowe':'OK',kind==='confirm'?'danger':'',()=>finish(kind==='prompt'?input.value:true));
  if(!d.open)d.showModal();
  if(input){input.focus();input.select()}
 });
}
function uiAlert(message,title='MotoGarage'){return uiDialog({title,message})}
function uiConfirm(message,title='Potwierdzenie'){return uiDialog({title,message,kind:'confirm'})}
function uiPrompt(message,value=''){return uiDialog({title:'Udostępnij miejscówkę',message,kind:'prompt',value})}
const KEY='motogarage_v1';const initial={bikes:[],selected:'',services:[],expenses:[],tracks:[],visits:[],settings:{scope:'all',dark:80,blur:0,color:'#f58220',background:''}};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{db=structuredClone(initial)};// Usuń wyłącznie niezmodyfikowany motocykl demonstracyjny z poprzedniej wersji.
if(db.bikes?.length===1 && db.bikes[0]?.id==='asix' && db.bikes[0]?.name==='ASIX XR99 300' && !db.bikes[0]?.year && db.bikes[0]?.engine==='4T' && Number(db.bikes[0]?.km)===0 && Number(db.bikes[0]?.mth)===0 && !db.bikes[0]?.note && !db.bikes[0]?.photo && !db.services?.length && !db.expenses?.length && !db.visits?.length){db.bikes=[];db.selected='';try{localStorage.setItem(KEY,JSON.stringify(db))}catch(_){}}
let tab='home';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2,10);const bike=()=>db.bikes.find(b=>b.id===db.selected)||db.bikes[0];const money=n=>Number(n||0).toLocaleString('pl-PL',{style:'currency',currency:'PLN'});function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){uiAlert('Brak miejsca w pamięci przeglądarki. Zmniejsz zdjęcia lub wykonaj eksport danych.')}render()}function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2300)}function go(t){tab=t;render();window.scrollTo(0,0)}function layout(title,content){return `<h2>${title}</h2>${content}`}function render(){const s=db.settings;document.documentElement.style.setProperty('--accent',s.color);$('#bg').style.backgroundImage=s.background&&(s.scope==='all'||tab==='home')?`url(${s.background})`:'';$('#bg').style.filter=`blur(${s.blur}px)`;$('#shade').style.background=`rgba(12,15,20,${s.dark/100})`;let b=bike();let html='';if(tab==='home'){let last=db.services.filter(x=>x.bikeId===b?.id).sort((a,z)=>z.date.localeCompare(a.date))[0];let total=db.expenses.filter(x=>x.bikeId===b?.id).reduce((a,x)=>a+Number(x.amount),0)+db.services.filter(x=>x.bikeId===b?.id).reduce((a,x)=>a+Number(x.cost||0),0);html=layout('Twój garaż',`<div class="card">${b?.photo?`<img class="photo" src="${b.photo}">`:''}<div class="muted">AKTUALNY MOTOCYKL</div><h2>${esc(b?.name||'Dodaj motocykl')}</h2><label>Przełącz motocykl<select onchange="db.selected=this.value;save()">${db.bikes.map(x=>`<option value="${x.id}" ${x.id===db.selected?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="actions"><button onclick="openEntryForm('bike', '${b?.id||''}')">Edytuj motocykl</button><button class="secondary" onclick="go('bikes')">Moje motocykle</button></div></div><div class="stats"><div class="card"><div class="muted">Motogodziny</div><div class="big">${esc(b?.mth||0)} mth</div></div><div class="card"><div class="muted">Przebieg</div><div class="big">${esc(b?.km||0)} km</div></div><div class="card"><div class="muted">Wydatki</div><div class="big">${money(total)}</div></div><div class="card"><div class="muted">Ostatni serwis</div><strong>${last?esc(last.date):'Brak wpisu'}</strong></div></div><div class="actions"><button onclick="openEntryForm('service')">+ Serwis</button><button onclick="openEntryForm('expense')">+ Wydatek</button><button onclick="openEntryForm('track')">+ Miejscówka</button></div><div class="card"><h3>Przypomnienia</h3>${db.services.filter(x=>x.bikeId===b?.id&&x.nextMth!==''&&x.nextMth!=null).map(x=>`<div class="item"><span>${esc(x.type)} — przy ${esc(x.nextMth)} mth</span><strong class="tag">${Number(x.nextMth)-Number(b.mth)<=0?'Termin minął':`${(Number(x.nextMth)-Number(b.mth)).toFixed(1)} mth`}</strong></div>`).join('')||'<p class="muted">Brak zaplanowanych przeglądów.</p>'}</div>`)}
if(tab==='bikes')html=layout('Moje motocykle',`<button onclick="openEntryForm('bike')">+ Dodaj motocykl</button>${db.bikes.map(x=>`<div class="card">${x.photo?`<img class="photo" src="${x.photo}">`:''}<h3>${esc(x.name)} ${x.id===db.selected?'<span class="tag">✓ aktywny</span>':''}</h3><p class="muted">${esc(x.year)} · ${esc(x.engine)} · ${esc(x.mth)} mth · ${esc(x.km)} km</p><p>${esc(x.note)}</p><div class="actions"><button onclick="db.selected='${x.id}';save();go('home')">Wybierz</button><button class="secondary" onclick="openEntryForm('bike','${x.id}')">Edytuj</button><button class="ghost" onclick="remove('bikes','${x.id}')">Usuń</button></div></div>`).join('')}`);
if(tab==='service')html=layout('Historia serwisowa',`<button onclick="openEntryForm('service')">+ Dodaj wpis</button>${db.services.slice().sort((a,z)=>z.date.localeCompare(a.date)).map(x=>`<div class="card"><div class="muted">${esc(x.date)} · ${esc(db.bikes.find(b=>b.id===x.bikeId)?.name||'Motocykl usunięty')} · ${esc(x.mth)} mth</div><h3>${esc(x.type)}</h3><p>${esc(x.note)}</p>${x.photo?`<img class="photo" src="${x.photo}">`:''}<p>Koszt: ${money(x.cost)} ${x.nextMth?`· Następny serwis: ${esc(x.nextMth)} mth`:''}</p><div class="actions"><button class="secondary" onclick="openEntryForm('service','${x.id}')">Edytuj</button><button class="ghost" onclick="remove('services','${x.id}')">Usuń</button></div></div>`).join('')||'<div class="empty">Nie masz jeszcze wpisów serwisowych.</div>'}`);
if(tab==='expenses'){let total=db.expenses.reduce((a,x)=>a+Number(x.amount),0);html=layout('Wydatki',`<div class="card"><div class="muted">Wydatki dodane w tej zakładce</div><div class="big">${money(total)}</div><p class="muted tiny">Koszty wpisane w serwisie są liczone osobno, bez podwójnego sumowania.</p></div><button onclick="openEntryForm('expense')">+ Dodaj wydatek</button>${db.expenses.slice().sort((a,z)=>z.date.localeCompare(a.date)).map(x=>`<div class="card"><div class="muted">${esc(x.date)} · ${esc(x.category)} · ${esc(db.bikes.find(b=>b.id===x.bikeId)?.name||'Inny')}</div><div class="item"><strong>${esc(x.note||'Wydatek')}</strong><strong>${money(x.amount)}</strong></div>${x.photo?`<img class="photo" src="${x.photo}">`:''}<div class="actions"><button class="secondary" onclick="openEntryForm('expense','${x.id}')">Edytuj</button><button class="ghost" onclick="remove('expenses','${x.id}')">Usuń</button></div></div>`).join('')||'<div class="empty">Nie masz jeszcze wydatków.</div>'}`)}
if(tab==='tracks')html=layout('Tory i miejscówki',`<button onclick="openEntryForm('track')">+ Dodaj miejscówkę</button>${db.tracks.map(x=>`<div class="card">${x.photo?`<img class="photo" src="${x.photo}">`:''}<h3>${x.favorite?'⭐ ':''}${esc(x.name)}</h3><div class="muted">${esc(x.type)}</div><p>${esc(x.note)}</p><div class="actions">${/^https:\/\/(www\.)?(google\.[^/]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps)/i.test(x.link)?`<button onclick="window.open('${esc(x.link)}','_blank','noopener')">📍 Nawiguj</button>`:''}<button class="secondary" onclick="openEntryForm('visit','${x.id}')">+ Wizyta</button><button class="secondary" onclick="shareTrack('${x.id}')">Udostępnij</button><button class="secondary" onclick="openEntryForm('track','${x.id}')">Edytuj</button><button class="ghost" onclick="remove('tracks','${x.id}')">Usuń</button></div><div class="muted">Wizyty: ${db.visits.filter(v=>v.trackId===x.id).length}</div>${db.visits.filter(v=>v.trackId===x.id).map(v=>`<div class="item"><span>${esc(v.date)} · ${esc(db.bikes.find(b=>b.id===v.bikeId)?.name||'Motocykl')}<br>${esc(v.note)}</span><button class="ghost" onclick="remove('visits','${v.id}')">✕</button></div>`).join('')}</div>`).join('')||'<div class="empty">Dodaj pierwszy tor lub miejscówkę.</div>'}`);
if(tab==='settings')html=layout('Ustawienia',`<div class="card"><h3>Wygląd i personalizacja</h3><label>Zdjęcie tła<input type="file" accept="image/*" onchange="upload(this, 'background')"></label><label>Gdzie pokazywać zdjęcie?<select id="scope" onchange="db.settings.scope=this.value;save()"><option value="all" ${s.scope==='all'?'selected':''}>Cała aplikacja</option><option value="home" ${s.scope==='home'?'selected':''}>Tylko ekran Start</option></select></label><label>Przyciemnienie: ${s.dark}%<input type="range" min="0" max="95" value="${s.dark}" oninput="db.settings.dark=+this.value;save()"></label><label>Rozmycie: ${s.blur}px<input type="range" min="0" max="20" value="${s.blur}" oninput="db.settings.blur=+this.value;save()"></label><label>Gotowe motywy<select onchange="db.settings.color=this.value;save()"><option value="">Wybierz styl</option><option value="#f58220">Enduro Orange</option><option value="#f04444">Racing Red</option><option value="#42a5ff">Electric Blue</option><option value="#70ca83">Forest Green</option><option value="#b9c0c9">Stealth Black</option><option value="#e17a21">Light Garage (akcent)</option></select></label><label>Kolor motywu<input type="color" value="${esc(s.color)}" onchange="db.settings.color=this.value;save()"></label><button class="secondary" onclick="db.settings.background='';save()">Usuń zdjęcie tła</button></div><div class="card"><h3>Kopia zapasowa</h3><p class="muted">Eksport JSON zapisuje motocykle, historię, miejscówki i zdjęcia. Import zastępuje obecne dane.</p><div class="actions"><button onclick="exportData()">Eksportuj dane</button><label class="btn" style="display:inline-block">Importuj dane<input type="file" accept="application/json,.json" onchange="importData(this)" style="display:none"></label></div></div><div class="card"><h3>O prototypie</h3><p class="muted">MotoGarage v0.2. Dane zapisują się lokalnie na tym urządzeniu. Dla bezpieczeństwa regularnie wykonuj kopie zapasowe.</p></div>`);
$('#main').innerHTML=html;$('#nav').innerHTML=[['home','⌂','Start'],['bikes','🏍','Motocykle'],['service','🔧','Serwis'],['expenses','💰','Wydatki'],['tracks','📍','Miejscówki']].map(([id,ic,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${label}</button>`).join('')}
const field=(name,label,value='',type='text',extra='')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;const area=(name,label,value='')=>`<label>${label}<textarea name="${name}">${esc(value)}</textarea></label>`;const selectBike=value=>`<label>Motocykl<select name="bikeId">${db.bikes.map(b=>`<option value="${b.id}" ${value===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label>`;const photoField=`<label>Zdjęcie (opcjonalnie)<input type="file" name="photoFile" accept="image/*"></label>`;function openEntryForm(type,id=''){if(['service','expense','visit'].includes(type)&&!db.bikes.length){uiAlert('Najpierw dodaj motocykl w zakładce Motocykle.');go('bikes');return}let obj,fields='',title='';if(type==='bike'){obj=db.bikes.find(x=>x.id===id)||{};title='Motocykl';fields=field('name','Nazwa / model',obj.name,'text','required')+field('year','Rocznik',obj.year)+field('engine','Silnik (np. 4T)',obj.engine)+field('km','Przebieg (km)',obj.km||0,'number','min="0" step="0.1"')+field('mth','Motogodziny',obj.mth||0,'number','min="0" step="0.1"')+area('note','Notatki',obj.note)+photoField}else if(type==='service'){obj=db.services.find(x=>x.id===id)||{};title='Wpis serwisowy';fields=selectBike(obj.bikeId||db.selected)+field('type','Rodzaj czynności',obj.type,'text','required')+field('date','Data',obj.date||new Date().toISOString().slice(0,10),'date','required')+field('mth','Stan motogodzin',obj.mth ?? db.bikes.find(b=>b.id===(obj.bikeId||db.selected))?.mth ?? 0,'number','min="0" step="0.1"')+area('note','Opis prac',obj.note)+field('cost','Koszt (zł)',obj.cost||0,'number','min="0" step="0.01"')+field('nextMth','Przypomnienie przy mth (opcjonalnie)',obj.nextMth??'','number','min="0" step="0.1"')+photoField}else if(type==='expense'){obj=db.expenses.find(x=>x.id===id)||{};title='Wydatek';fields=selectBike(obj.bikeId||db.selected)+`<label>Kategoria<select name="category">${['Paliwo','Części','Olej','Akcesoria','Inne'].map(x=>`<option ${obj.category===x?'selected':''}>${x}</option>`).join('')}</select></label>`+field('amount','Kwota (zł)',obj.amount||0,'number','required min="0" step="0.01"')+field('date','Data',obj.date||new Date().toISOString().slice(0,10),'date','required')+area('note','Opis',obj.note)+photoField}else if(type==='track'){obj=db.tracks.find(x=>x.id===id)||{};title='Miejscówka';fields=field('name','Nazwa',obj.name,'text','required')+`<label>Rodzaj terenu<select name="type">${['Motocross','Superenduro','Cross-country','Żwirownia','Enduro','Inne'].map(x=>`<option ${obj.type===x?'selected':''}>${x}</option>`).join('')}</select></label>`+area('note','Opis',obj.note)+field('link','Link do Map Google',obj.link,'url')+`<label><input type="checkbox" name="favorite" ${obj.favorite?'checked':''}> Ulubiona miejscówka</label>`+photoField}else if(type==='visit'){obj={trackId:id};title='Nowa wizyta';fields=selectBike(db.selected)+field('date','Data wizyty',new Date().toISOString().slice(0,10),'date','required')+area('note','Jak poszło?')};$('#modalBody').innerHTML=`<h2>${title}</h2><form id="entry">${fields}<div class="actions"><button type="submit">Zapisz</button><button type="button" class="secondary" onclick="$('#modal').close()">Anuluj</button></div></form>`;$('#modal').showModal();if(type==='service'&&!id){const entryForm=$('#entry');entryForm.elements.bikeId.addEventListener('change',e=>{const chosen=db.bikes.find(b=>b.id===e.target.value);entryForm.elements.mth.value=chosen?.mth ?? 0})}$('#entry').onsubmit=async e=>{e.preventDefault();const f=e.target;const data=Object.fromEntries(new FormData(f));delete data.photoFile;if(type==='track'){data.favorite=f.elements.favorite.checked;if(data.link&&!/^https:\/\/(www\.)?(google\.[^/]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps)/i.test(data.link)){uiAlert('Wklej poprawny link do Map Google.');return}}let file=f.elements.photoFile?.files?.[0];if(file){if(file.size>5e6){uiAlert('Wybierz zdjęcie mniejsze niż 5 MB.');return}data.photo=await resize(file)}else if(obj.photo)data.photo=obj.photo;data.id=id&&type!=='visit'?id:uid();if(type==='visit')data.trackId=id;let key={bike:'bikes',service:'services',expense:'expenses',track:'tracks',visit:'visits'}[type];if(type!=='visit'&&id){db[key]=db[key].map(x=>x.id===id?data:x)}else db[key].push(data);if(type==='bike'&&!db.selected)db.selected=data.id;$('#modal').close();save();toast('Zapisano')};};function resize(file){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1000/img.width,1000/img.height);const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};img.onerror=reject;img.src=URL.createObjectURL(file)})}async function upload(el,target){if(!el.files[0])return;db.settings.background=await resize(el.files[0]);save();toast('Tło zmienione')}async function remove(key,id){const names={bikes:'motocykl',services:'wpis serwisowy',expenses:'wydatek',tracks:'miejscówkę',visits:'wizytę'};if(!await uiConfirm('Czy na pewno chcesz usunąć '+(names[key]||'wpis')+'? Tej operacji nie można cofnąć.','Potwierdź usunięcie'))return;db[key]=db[key].filter(x=>x.id!==id);if(key==='bikes'&&db.selected===id)db.selected=db.bikes[0]?.id||'';save()}function download(name,data){const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportData(){download('MotoGarage_kopia_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db));toast('Wyeksportowano kopię')}async function importData(el){if(!el.files[0])return;try{let d=JSON.parse(await el.files[0].text());if(!Array.isArray(d.bikes)||!Array.isArray(d.services)||!Array.isArray(d.expenses)||!Array.isArray(d.tracks)||!d.settings)throw Error('Niepoprawny plik');if(await uiConfirm('Zastąpić wszystkie aktualne dane kopią?','Import kopii zapasowej')){db=d;db.visits??=[];save();toast('Zaimportowano dane')}}catch(e){uiAlert('Nie udało się zaimportować pliku: '+e.message)}}function shareTrack(id){let x=db.tracks.find(t=>t.id===id);let text=`🏍️ ${x.name}\n${x.type}\n${x.note}\n${x.link||''}`;if(navigator.share){navigator.share({title:x.name,text}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast('Skopiowano miejscówkę')).catch(()=>uiPrompt('Skopiuj:',text))}else uiPrompt('Skopiuj:',text)}render();</script></body></html>
