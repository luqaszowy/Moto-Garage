function uiDialog({title='MotoGarage',message='',kind='info',value=''}){
 return new Promise(resolve=>{
  const d=document.getElementById('noticeDialog');
  const titleEl=document.getElementById('noticeTitle'), textEl=document.getElementById('noticeText');
  const extra=document.getElementById('noticeExtra'), actions=document.getElementById('noticeActions');
  titleEl.textContent=title; textEl.textContent=message; extra.replaceChildren(); actions.replaceChildren();
  let finished=false;
  const finish=v=>{if(finished)return;finished=true;d.removeEventListener('cancel',cancel);d.close();resolve(v)};

function shareTrack(id){let x=db.tracks.find(t=>t.id===id);let text=`🏍️ ${x.name}\n${x.type}\n${x.note}\n${x.link||''}`;if(navigator.share){navigator.share({title:x.name,text}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast('Skopiowano miejscówkę')).catch(()=>uiPrompt('Skopiuj:',text))}else uiPrompt('Skopiuj:',text)}document.addEventListener('change',function(e){const input=e.target;if(input.matches('.photo-picker input[type="file"]')){const name=input.parentElement.nextElementSibling;if(name)name.textContent=input.files?.[0]?.name||'';}});render();</script></body></html>
