
name: MotoGarage APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "Moto Garage Android"

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Zainstaluj Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Przygotuj Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Zbuduj APK
        run: gradle assembleDebug --no-daemon

      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoGarage-APK
          path: "Moto Garage Android/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
