name: MotoGarage APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MotoGarage_Android

    env:
      ANDROID_KEYSTORE_PATH: /tmp/motogarage-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Zainstaluj Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Przygotuj Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Odtworz staly klucz podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] ||
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] ||
             [ -z "$ANDROID_KEY_ALIAS" ] ||
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Brakuje sekretow podpisywania."
            exit 1
          fi

          umask 077
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Zbuduj podpisane APK
        run: gradle assembleRelease --no-daemon

      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoGarage-APK-release
          path: MotoGarage_Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Usun tymczasowy klucz
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
